name: Publicar Career-Fit web

on:
  push:
    branches: [main]
    paths:
      - 'web/web/**'
      - 'shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/web/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Compilar demo
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --mode pages --base "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
